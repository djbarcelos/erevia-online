# Testes a cada push e pull request. A Railway só publica a main quando tudo passa
# (checkSuites em .railway/railway.ts).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Servidor (Go + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: erevia
          POSTGRES_PASSWORD: erevia
          POSTGRES_DB: erevia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erevia"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: server
    env:
      # Sem esta variável os testes do store são pulados; aqui eles precisam rodar.
      TEST_DATABASE_URL: postgres://erevia:erevia@localhost:5432/erevia?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test ./... -race -count=1
      # Fuzz da entrada dos jogadores (README): o corpus de testdata/fuzz já rodou no go test
      # acima; aqui cada alvo procura entradas novas por alguns segundos.
      - name: Fuzz (10 s por alvo)
        run: |
          go test ./internal/zone -run '^$' -fuzz '^FuzzZoneBytes$' -fuzztime 10s
          go test ./internal/zone -run '^$' -fuzz '^FuzzZoneSemantic$' -fuzztime 10s
          go test ./internal/net -run '^$' -fuzz '^FuzzConnBytes$' -fuzztime 10s
      - name: Guardar a entrada que o fuzz achou
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-testdata
          path: server/internal/*/testdata/fuzz

  client:
    name: Cliente (tipos + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test:unit
      # Orçamento do guia de arte (triângulos por LOD, textura, materiais, ossos) de todo GLB de
      # public/models; categoria e exceções em client/scripts/assets-manifest.json.
      - name: Orçamento de assets
        run: npm run check:assets
      # O world.json commitado (cliente e servidor) tem de ser o que os biomas geram.
      - name: world.json igual ao gerado
        run: |
          node scripts/build-world.mjs
          sha256sum public/world.json ../server/internal/world/world.json
          git diff --exit-code --stat -- public/world.json ../server/internal/world/world.json
      # O mesmo para as masmorras (scripts/dungeons/): o mapa do cliente e do servidor sai do gerador.
      - name: mapas das masmorras iguais aos gerados
        run: |
          node scripts/build-dungeons.mjs
          git diff --exit-code --stat -- public/worlds ../server/internal/world/maps
      - run: npm run build

