version: v2
clean: true
plugins:
  # Go -> server/internal/pb/game.pb.go
  - local: protoc-gen-go
    out: server/internal/pb
    opt:
      - module=erevia/server/internal/pb
  # TypeScript -> client/src/gen/erevia/v1/game_pb.ts
  - local: client/node_modules/.bin/protoc-gen-es
    out: client/src/gen
    opt:
      - target=ts
