<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Erevia</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div><span class="k">FPS</span> <span id="hud-fps">–</span></div>
      <div><span class="k">Ping</span> <span id="hud-ping">–</span></div>
      <div><span class="k">Online</span> <span id="hud-online">–</span></div>
      <div><span class="k">Pos</span> <span id="hud-pos">–</span></div>
    </div>

    <div id="help" hidden>Clique esquerdo: andar · Botão direito: girar câmera · Roda: zoom</div>

    <div id="overlay">
      <form id="login">
        <h1>Erevia</h1>
        <p class="sub">Fase 0 · protótipo</p>
        <input id="name" name="name" placeholder="Nome do personagem" autocomplete="off"
               minlength="3" maxlength="16" pattern="[A-Za-z0-9]{3,16}" required autofocus />
        <button type="submit">Entrar</button>
        <p id="login-error" class="error" role="alert"></p>
        <p class="hint">3 a 16 letras ou números, sem espaço.</p>
      </form>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
