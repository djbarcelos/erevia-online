<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0810" />
    <title>Erevia</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" hidden>
      <div><span class="k">FPS</span> <span id="hud-fps">–</span></div>
      <div><span class="k">Ping</span> <span id="hud-ping">–</span></div>
      <div><span class="k">Online</span> <span id="hud-online">–</span></div>
      <div><span class="k">Pos</span> <span id="hud-pos">–</span></div>
    </div>

    <div id="chat" hidden>
      <ol id="chat-log" aria-live="polite" aria-label="Mensagens do chat"></ol>
      <form id="chat-form" autocomplete="off">
        <input id="chat-input" maxlength="220" placeholder="Enter para falar · /w Nome texto · /r texto"
               aria-label="Mensagem do chat" />
      </form>
    </div>

    <!-- Telas de entrada (login, personagens, mensagens): montadas por src/ui/screens.ts -->
    <div id="overlay"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
