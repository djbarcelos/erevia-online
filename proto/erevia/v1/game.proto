syntax = "proto3";

package erevia.v1;

option go_package = "erevia/server/internal/pb;pb";

// ---------- Cliente -> Servidor ----------

message ClientMessage {
  oneof msg {
    Join join = 1;
    MoveTo move_to = 2;
    Ping ping = 3;
    ChatSend chat_send = 4;
    Attack attack = 5;
    UseSkill use_skill = 6;
    Respawn respawn = 7;
    PickUp pick_up = 8;
    MoveItem move_item = 9;
    UseItem use_item = 10;
    DestroyItem destroy_item = 11;
    Buy buy = 12;
    Sell sell = 13;
    AllocateAttrs allocate_attrs = 14;
    LearnSkills learn_skills = 15;
    SetHotbar set_hotbar = 16;
    PartyCmd party_cmd = 17;
    ClanCmd clan_cmd = 18;
    InviteReply invite_reply = 19;
    Teleport teleport = 20;
    CancelChannel cancel_channel = 21;
    Enchant enchant = 22;
    StorageMove storage_move = 23;
    StorageGold storage_gold = 24;
    ChangeLook change_look = 25;
    TradeCmd trade_cmd = 26;
    Craft craft = 27;
    ClientStats client_stats = 28;
    FriendCmd friend_cmd = 29;
    MailCmd mail_cmd = 30;
    RankingRequest ranking_request = 31;
    AchievementCmd achievement_cmd = 32;
    SpecCmd spec_cmd = 50;
    MasteryCmd mastery_cmd = 54; // Maestria: pedir o estado, gastar ponto, redistribuir
    UseGate use_gate = 60; // zonas: atravessar o portão para outro mapa
  }
}

// ---------- Zonas (vários mapas no mesmo servidor) ----------

// Usa o portão (NPC com role NPC_ROLE_GATE) perto do jogador.
message UseGate {
  uint32 npc_id = 1;
}

// O personagem saiu desta zona pelo portão: o cliente mostra a tela de carregamento,
// descarta o mapa atual e espera o Welcome da zona de destino (a mesma conexão).
message ZoneChange {
  string map = 1; // id do mapa de destino ("starter", "teste"...)
  string title = 2; // nome do mapa ("Clareira de Testes")
  float x = 3; // ponto de chegada
  float z = 4;
}

// ---------- Maestria (depois do nível 30) ----------

enum MasteryCmdKind {
  MASTERY_CMD_UNSPECIFIED = 0;
  MASTERY_CMD_GET = 1; // pedir a árvore e o estado (a janela abriu)
  MASTERY_CMD_SPEND = 2; // gastar 1 ponto no nó `node`
  MASTERY_CMD_RESPEC = 3; // devolver todos os pontos (grátis, 1 vez por dia)
}

message MasteryCmd {
  MasteryCmdKind kind = 1;
  string node = 2;
}

// Estado da Maestria (só para o dono). Sai ao entrar no 30, a cada XP ganha no 30, ao
// morrer e quando a árvore muda. No 30 a barra de XP do HUD vira esta barra.
message MasteryState {
  bool active = 1; // nível 30: a barra enche e os pontos podem ser gastos
  uint32 level = 2; // pontos ganhos no total ("Maestria N")
  uint32 free = 3; // pontos para gastar
  uint64 xp = 4; // XP na barra atual
  uint64 need = 5; // XP de uma barra cheia (1 ponto)
  uint64 rested = 6; // bônus diário guardado: XP de barra que ainda enche rested_mult× mais rápido
  uint64 rested_max = 7; // o máximo guardado (rested_days barras)
  uint32 rested_mult = 8;
  uint32 rested_days = 9;
  repeated MasteryRank ranks = 10;
  bool respec_ready = 11; // o Redistribuir de hoje está livre
  uint32 max_level = 12; // teto da Maestria (a árvore inteira)
  float teleport_discount = 13; // Viajante: desconto nas Pedras de Teleporte (0–1)
}

message MasteryRank {
  string node = 1;
  uint32 rank = 2;
}

// A árvore da Maestria (o cliente pede ao abrir a janela e guarda).
message MasteryTree {
  repeated MasteryBranchInfo branches = 1;
  repeated MasteryNodeInfo nodes = 2;
  uint32 node_max = 3; // pontos por nó
  float combat_cap = 4; // teto da soma dos bônus de combate com a árvore cheia (0,05)
}

message MasteryBranchInfo {
  string name = 1;
  string description = 2;
  string color = 3; // "#rrggbb"
}

message MasteryNodeInfo {
  string id = 1;
  string name = 2;
  uint32 branch = 3;
  uint32 req = 4; // pontos no ramo para abrir
  string icon = 5; // glifo (GLYPHS em client/src/ui/art.ts)
  repeated string ranks = 6; // texto do efeito com 1..node_max pontos (retorno decrescente)
  bool combat = 7; // entra no teto de combate
}

// ---------- Especialização (segunda classe, nível 20) ----------

enum SpecCmdKind {
  SPEC_CMD_UNSPECIFIED = 0;
  SPEC_CMD_TALK = 1; // falar com a Mestra dos Caminhos (npc_id): anda a missão e abre a escolha
  SPEC_CMD_CHOOSE = 2; // escolher o caminho spec (quem já tem um troca, pagando)
}

message SpecCmd {
  SpecCmdKind kind = 1;
  uint32 npc_id = 2;
  string spec = 3;
}

// Janela da Mestra: os dois caminhos da classe (Welcome.specs e as skills com spec).
message SpecChoice {
  uint32 npc_id = 1;
  string current = 2; // caminho atual ("" = ainda não escolheu: a escolha é de graça)
  uint64 change_cost = 3; // moedas para trocar de caminho depois de escolher
}

// Uma especialização (segunda classe).
message SpecInfo {
  string id = 1;
  string class = 2;
  string name = 3;
  string description = 4;
  string color = 5; // "#rrggbb"
  Attrs bonus = 6; // bônus passivo de atributos
  string bonus_text = 7; // "+12 Constituição"
}

// ---------- Ranking, conquistas e títulos ----------

// Pede o ranking (as três listas de uma vez). O servidor responde com Ranking.
message RankingRequest {}

enum AchievementCmdKind {
  ACHIEVEMENT_CMD_UNSPECIFIED = 0;
  ACHIEVEMENT_CMD_SET_TITLE = 1; // id = conquista cujo título usar ("" = sem título)
}

message AchievementCmd {
  AchievementCmdKind kind = 1;
  string id = 2;
}

// Amostra de desempenho do cliente (a cada ~60 s; o FPS é medido 1×/s, nunca por quadro).
message ClientStats {
  float fps_avg = 1;
  float fps_low = 2; // média dos 10% piores segundos
  string device = 3; // "mobile"/"desktop" + sistema (curto)
  uint32 seconds = 4; // segundos cobertos pela amostra
}

// Criar um item com uma receita do Ferreiro (materiais + moedas).
message Craft {
  uint32 npc_id = 1;
  string recipe_id = 2;
}

// ---------- Troca entre jogadores ----------

enum TradeCmdKind {
  TRADE_CMD_UNSPECIFIED = 0;
  TRADE_CMD_REQUEST = 1; // convidar target_id para trocar (vira um Invite para ele)
  TRADE_CMD_ADD_ITEM = 2; // oferecer o item do espaço slot da bolsa (count 0 = a pilha toda)
  TRADE_CMD_REMOVE_ITEM = 3; // tirar da oferta o item do espaço slot da bolsa
  TRADE_CMD_SET_GOLD = 4; // moedas oferecidas (gold)
  TRADE_CMD_LOCK = 5; // travar a própria oferta
  TRADE_CMD_CONFIRM = 6; // confirmar (só com as duas ofertas travadas)
  TRADE_CMD_CANCEL = 7;
}

message TradeCmd {
  TradeCmdKind kind = 1;
  uint32 target_id = 2;
  uint32 slot = 3;
  uint32 count = 4;
  int64 gold = 5;
}

// Visual do corpo. O valor zero é o visual original da classe.
message BodyLook {
  uint32 skin = 1; // 0 = original; i = paleta de pele [i-1]
  uint32 hair = 2; // 0 = original; i = paleta de cabelo [i-1]
  uint32 outfit = 3; // 0 = original; i = paleta de roupa [i-1]
  string head = 4; // "" = a cabeça da classe; senão knight, barbarian, mage, rogue ou ranger
  bool hide_hat = 5; // esconde elmo/gorro/chapéu
}

// Barbeiro: muda o visual (custa moedas).
message ChangeLook {
  uint32 npc_id = 1;
  BodyLook look = 2;
}

// ---------- Fase 4: grupo, clã, teleporte, encantamento e armazém ----------

enum PartyCmdKind {
  PARTY_CMD_UNSPECIFIED = 0;
  PARTY_CMD_INVITE = 1; // name = quem convidar (ou target_id)
  PARTY_CMD_LEAVE = 2;
  PARTY_CMD_KICK = 3; // target_id
  PARTY_CMD_LEADER = 4; // target_id = novo líder
}

message PartyCmd {
  PartyCmdKind kind = 1;
  string name = 2;
  uint32 target_id = 3;
}

enum ClanCmdKind {
  CLAN_CMD_UNSPECIFIED = 0;
  CLAN_CMD_CREATE = 1; // name = nome do clã
  CLAN_CMD_INVITE = 2; // name = quem convidar (ou target_id)
  CLAN_CMD_LEAVE = 3;
  CLAN_CMD_KICK = 4; // target_id = id do personagem
  CLAN_CMD_RANK = 5; // target_id + rank
  CLAN_CMD_LEADER = 6; // target_id = novo líder
  CLAN_CMD_DISBAND = 7;
  CLAN_CMD_NOTICE = 8; // text = aviso do clã
}

message ClanCmd {
  ClanCmdKind kind = 1;
  string name = 2;
  uint32 target_id = 3;
  ClanRank rank = 4;
  string text = 5;
}

enum ClanRank {
  CLAN_RANK_MEMBER = 0;
  CLAN_RANK_OFFICER = 1;
  CLAN_RANK_LEADER = 2;
}

// Resposta a um convite (grupo ou clã).
message InviteReply {
  uint32 invite_id = 1;
  bool accept = 2;
}

// Viajar a partir de uma Pedra de Teleporte.
message Teleport {
  uint32 npc_id = 1;
  uint32 dest_id = 2;
}

// Interrompe a canalização atual (teleporte, pergaminho de retorno).
message CancelChannel {}

// Usa um pergaminho de encantar (scroll_slot, na bolsa) num item (place/slot).
message Enchant {
  uint32 scroll_slot = 1;
  uint32 place = 2; // 0 = bolsa, 1 = equipado
  uint32 slot = 3;
}

// Move itens entre a bolsa (place 0) e o armazém (place 2).
message StorageMove {
  uint32 npc_id = 1;
  uint32 from_place = 2;
  uint32 from_slot = 3;
  uint32 to_place = 4;
  uint32 to_slot = 5;
  uint32 count = 6; // 0 = a pilha inteira
}

// Moedas: amount > 0 guarda, < 0 retira.
message StorageGold {
  uint32 npc_id = 1;
  int64 amount = 2;
}

// Distribui pontos de atributo livres (soma aos já gastos). Tudo ou nada.
message AllocateAttrs {
  Attrs add = 1;
}

// Novos ranks das skills (só aumentar). Tudo ou nada: o servidor confere nível,
// pontos livres e o nó de cima de cada ramo.
message LearnSkills {
  repeated SkillRank ranks = 1;
}

// Barra de atalhos inteira (10 espaços): "skill:<id>", "item:<id do item>" ou "".
message SetHotbar {
  repeated string slots = 1;
}

message Attrs {
  uint32 str = 1; // Força
  uint32 dex = 2; // Destreza
  uint32 con = 3; // Constituição
  uint32 int = 4; // Inteligência
  uint32 wis = 5; // Sabedoria
  uint32 spi = 6; // Espírito
}

message SkillRank {
  uint32 skill_id = 1;
  uint32 rank = 2;
}

// Primeira mensagem após conectar. A conta vem do cookie de sessão;
// o servidor confere se o personagem pertence a ela.
message Join {
  uint32 character_id = 1;
}

// Pedido para andar até um ponto do chão. Cancela o ataque atual.
message MoveTo {
  float x = 1;
  float z = 2;
  bool stop = 3; // parar onde estiver no servidor (x/z ignorados): soltar o WASD/joystick
}

message Ping {
  double client_time = 1;
}

// Mensagem de chat. "to" vazio = canal geral; preenchido = sussurro para esse nome.
message ChatSend {
  string text = 1;
  string to = 2;
  ChatChannel channel = 3; // GRUPO ou CLÃ (vazio = geral/sussurro pelo "to")
}

// Seleciona o alvo e ataca automaticamente (anda até o alcance se precisar).
message Attack {
  uint32 target_id = 1;
  bool force = 2; // atacar um jogador que não é hostil (Ctrl + clique)
}

// Usa uma skill. target_id é ignorado em skills de si mesmo/área.
message UseSkill {
  uint32 skill_id = 1;
  uint32 target_id = 2;
  bool force = 3;
}

// Morto: voltar à cidade.
message Respawn {}

// Pegar um item do chão (anda até ele se precisar).
message PickUp {
  uint32 id = 1;
}

// Lugares de um item: 0 = bolsa, 1 = equipado (slot = encaixe).
// Mover entre espaços da bolsa (troca ou junta pilhas), equipar, desequipar ou trocar
// dois encaixes de equipamento (anel 1 ↔ anel 2).
message MoveItem {
  uint32 from_place = 1;
  uint32 from_slot = 2;
  uint32 to_place = 3;
  uint32 to_slot = 4;
}

// Usar: poção bebe; equipamento na bolsa equipa; equipado volta para a bolsa.
message UseItem {
  uint32 place = 1;
  uint32 slot = 2;
}

// Destruir itens de um espaço da bolsa.
message DestroyItem {
  uint32 slot = 1;
  uint32 count = 2;
}

// Comprar de um NPC (precisa estar perto dele).
message Buy {
  uint32 npc_id = 1;
  string item_id = 2;
  uint32 count = 3;
}

// Vender a um NPC itens de um espaço da bolsa.
message Sell {
  uint32 npc_id = 1;
  uint32 slot = 2;
  uint32 count = 3;
}

// ---------- Servidor -> Cliente ----------

message ServerMessage {
  oneof msg {
    Welcome welcome = 1;
    Spawn spawn = 2;
    Despawn despawn = 3;
    Snapshot snapshot = 4;
    Pong pong = 5;
    ChatMessage chat = 6;
    Kicked kicked = 7;
    SelfStats self_stats = 8;
    SkillCooldown skill_cooldown = 9;
    Inventory inventory = 10;
    GroundItemsAdded ground_added = 11;
    GroundItemsRemoved ground_removed = 12;
    ItemCooldown item_cooldown = 13;
    Appearance appearance = 14;
    Progress progress = 15;
    Hotbar hotbar = 16;
    PlayerStatus player_status = 17;
    SelfPvp self_pvp = 18;
    Invite invite = 19;
    PartyState party = 20;
    ClanState clan = 21;
    ChannelBar channel_bar = 22;
    EnchantResult enchant_result = 23;
    Storage storage = 24;
    Announce announce = 25;
    BossStatus boss_status = 26;
    QuestLog quest_log = 27;
    TradeState trade = 28;
    SocialUpdate social = 29;
    Emote emote = 30;
    Ranking ranking = 31;
    Achievements achievements = 32;
    SpecChoice spec_choice = 50;
    EventStatus event_status = 52; // eventos: invasão da cidade e XP em dobro
    MasteryState mastery = 54; // Maestria (nível 30): barra, pontos e árvore do jogador
    MasteryTree mastery_tree = 55; // a árvore da Maestria (resposta ao MASTERY_CMD_GET)
    ZoneChange zone_change = 60; // saiu pelo portão: o próximo Welcome é o do outro mapa
  }
}

// Ranking calculado no banco a cada poucos minutos (o servidor guarda em memória).
message Ranking {
  repeated RankEntry level = 1; // top 50 por nível (desempate: XP)
  repeated RankEntry pvp = 2; // top 50 por vitórias PvP
  repeated ClanRankEntry clans = 3; // top 50 clãs pela soma dos níveis dos membros
  int64 updated_at_ms = 4; // quando foi calculado (Unix, ms; 0 = ainda não calculado)
  uint32 refresh_ms = 5; // intervalo entre os cálculos
  // Posição do próprio personagem (e do clã dele) no último cálculo (0 = fora do ranking).
  uint32 my_level_pos = 6;
  uint32 my_pvp_pos = 7;
  uint32 my_clan_pos = 8;
}

message RankEntry {
  uint32 pos = 1;
  uint64 character_id = 2;
  string name = 3;
  string class = 4;
  uint32 level = 5;
  uint32 pvp_kills = 6;
  string clan_name = 7;
  string title = 8;
  uint32 mastery = 9; // nível de Maestria (0 = abaixo do 30 ou nenhum ponto)
}

message ClanRankEntry {
  uint32 pos = 1;
  uint64 id = 2;
  string name = 3;
  uint32 members = 4;
  uint32 level_sum = 5;
  float level_avg = 6;
  string leader = 7;
}

// Conquistas do próprio personagem. Ao entrar vai o catálogo inteiro (full); depois, só
// o que mudou (progresso, desbloqueio ou título escolhido).
message Achievements {
  bool full = 1;
  repeated AchievementInfo list = 2; // full: todas; senão, só as que mudaram (id, count, unlocked)
  string title_id = 3; // conquista cujo título está em uso ("" = nenhum)
  string unlocked = 4; // nome da conquista que acabou de ser desbloqueada ("" = nenhuma)
}

message AchievementInfo {
  string id = 1;
  string name = 2;
  string text = 3; // o que fazer
  string title = 4; // título que ela dá
  bool unlocked = 5;
  uint32 count = 6; // progresso (conquistas de contagem)
  uint32 need = 7;
  int64 unlocked_at_ms = 8;
}

// Janela de troca: enviada aos dois a cada mudança; open = false fecha a janela.
message TradeState {
  bool open = 1;
  uint32 partner_id = 2;
  string partner_name = 3;
  TradeOffer mine = 4;
  TradeOffer theirs = 5;
}

message TradeOffer {
  repeated TradeItem items = 1;
  int64 gold = 2;
  bool locked = 3;
  bool confirmed = 4;
}

message TradeItem {
  uint32 slot = 1; // espaço na bolsa de quem oferece
  string item_id = 2;
  uint32 count = 3;
  uint32 enchant = 4;
}

// Missões ativas do próprio personagem: ao entrar e sempre que o progresso muda.
message QuestLog {
  repeated QuestInfo quests = 1;
  string completed = 2; // título da missão que acabou de ser concluída ("" = nenhuma)
}

message QuestInfo {
  string id = 1;
  string title = 2;
  string text = 3;
  repeated QuestStepInfo steps = 4;
  string reward = 5; // resumo da recompensa ("120 XP · 30 moedas")
}

// Onde fica um objetivo: o minimapa, o mapa e a seta da borda da tela apontam para lá.
enum QuestPlaceKind {
  QUEST_PLACE_KIND_NONE = 0; // sem lugar (usar skill, tomar poção)
  QUEST_PLACE_KIND_HUNT = 1; // área de caça (círculo de centro x, z e raio radius)
  QUEST_PLACE_KIND_NPC = 2; // um NPC (falar com ele)
  QUEST_PLACE_KIND_GATE = 3; // portão da cidade
  QUEST_PLACE_KIND_STONE = 4; // Pedra de Teleporte
  QUEST_PLACE_KIND_SHOP = 5; // loja (NPC que vende)
}

message QuestStepInfo {
  string text = 1;
  uint32 count = 2;
  uint32 need = 3;
  // Lugar do objetivo (só nos que faltam). Calculado pelo servidor quando o QuestLog vai:
  // ao mudar o passo e ao subir de nível; nunca por tick.
  QuestPlaceKind place = 4;
  float x = 5;
  float z = 6;
  float radius = 7; // metros: chegou quando está dentro
  string place_name = 8; // rótulo no mapa ("Esqueleto Lacaio", "Ysolde", "Portão Leste")
  // Matar: nomes dos monstros que contam (o "Caçar aqui" só mira neles). Vazio = qualquer
  // monstro (ou o passo não é de caçar).
  repeated string monsters = 9;
}

// ---------- Eventos (invasão da cidade e XP em dobro) ----------

enum InvasionPhase {
  INVASION_PHASE_NONE = 0;
  INVASION_PHASE_WARNING = 1; // anunciada: começa em at_ms
  INVASION_PHASE_ACTIVE = 2; // as ondas estão chegando; acaba por tempo em at_ms
}

// Estado dos eventos do servidor (indicador discreto no HUD). Vai logo depois do Welcome
// (se houver algo ligado) e a cada mudança; durante a invasão, no máximo 1×/s.
message EventStatus {
  bool xp2 = 1; // XP de monstros em dobro
  int64 xp2_until_ms = 2; // até quando (relógio do servidor; 0 = sem previsão)
  InvasionPhase invasion = 3;
  int64 invasion_at_ms = 4; // aviso: quando as ondas começam; ativa: o tempo limite
  uint32 wave = 5; // onda atual (1…waves)
  uint32 waves = 6;
  uint32 alive = 7; // esqueletos vivos agora
}

// ---------- Raid boss ----------

enum AnnounceKind {
  ANNOUNCE_KIND_UNSPECIFIED = 0;
  ANNOUNCE_KIND_BOSS_SOON = 1; // o raid boss desperta em breve
  ANNOUNCE_KIND_BOSS_SPAWN = 2; // despertou
  ANNOUNCE_KIND_BOSS_DEFEAT = 3; // foi derrotado
}

// Anúncio para o servidor inteiro (banner no centro da tela e linha dourada no chat).
message Announce {
  string title = 1;
  string text = 2;
  AnnounceKind kind = 3;
}

// Estado de um chefe (mapa do mundo e barra do raid). Vai no Welcome e a cada mudança.
message BossStatus {
  uint32 id = 1;
  string name = 2;
  uint32 level = 3;
  float x = 4;
  float z = 5;
  bool raid = 6;
  bool alive = 7;
  // Morto: janela em que ele renasce (Unix, ms). O minuto exato não é revelado.
  int64 window_start_ms = 8;
  int64 window_end_ms = 9;
  uint32 phase = 10; // raid: fase da luta (1–3)
  bool enraged = 11; // raid: fúria (abaixo de 20%)
  bool final_enrage = 12; // raid: fúria final (luta longa demais)
  int64 fight_start_ms = 13; // raid: início da luta (0 = parado)
}

enum TelegraphKind {
  TELEGRAPH_KIND_UNSPECIFIED = 0;
  TELEGRAPH_KIND_WAVE = 1; // Onda de Ossos: em volta do chefe
  TELEGRAPH_KIND_RAIN = 2; // Chuva de Ossos: em cima de um jogador
  TELEGRAPH_KIND_MARK = 3; // Marca da Morte: segue o marcado e explode em volta dele
  TELEGRAPH_KIND_STRIKE = 4; // habilidade de monstro comum ou chefe de campo (pancada no chão)
}

// Forma do aviso. x, z é a origem: o centro (círculo e anel) ou o ponto de onde sai o
// cone ou a linha, na direção angle.
enum TelegraphShape {
  TELEGRAPH_SHAPE_CIRCLE = 0; // raio radius
  TELEGRAPH_SHAPE_CONE = 1; // raio radius e abertura total arc
  TELEGRAPH_SHAPE_LINE = 2; // retângulo de length × width saindo de x, z
  TELEGRAPH_SHAPE_DONUT = 3; // anel entre inner_radius e radius (o buraco é seguro)
}

// Aviso no chão: o golpe cai no fim, em quem ainda estiver dentro da forma.
message Telegraph {
  uint32 id = 1;
  TelegraphKind kind = 2;
  float x = 3;
  float z = 4;
  float radius = 5;
  uint32 duration_ms = 6;
  uint32 source_id = 7;
  uint32 follow_id = 8; // segue esta entidade (Marca da Morte)
  bool resolved = 9; // o golpe caiu agora (em x, z)
  bool cancelled = 10; // o monstro desistiu da luta ou morreu antes
  TelegraphShape shape = 11;
  float angle = 12; // direção do cone e da linha (rad, em Y: 0 = +Z, π/2 = +X)
  float arc = 13; // cone: abertura total (rad)
  float length = 14; // linha: comprimento (m)
  float width = 15; // linha: largura (m)
  float inner_radius = 16; // anel: raio do buraco seguro (m)
}

enum PvpState {
  PVP_STATE_NORMAL = 0;
  PVP_STATE_FLAGGED = 1; // atacou um jogador há pouco (nome roxo)
  PVP_STATE_CHAOTIC = 2; // tem karma (nome vermelho)
}

// Estado PvP e clã de um jogador mudou (para todos).
message PlayerStatus {
  uint32 id = 1;
  PvpState pvp_state = 2;
  string clan_name = 3;
  string title = 4; // título escolhido (de uma conquista; "" = nenhum)
  string spec = 5; // especialização (SpecInfo.id; "" = nenhuma)
}

// PvP do próprio personagem.
message SelfPvp {
  uint32 karma = 1;
  uint32 pk_count = 2;
  uint32 pvp_kills = 3;
  uint32 flag_ms = 4; // tempo de flag restante (0 = sem flag)
}

enum InviteKind {
  INVITE_KIND_UNSPECIFIED = 0;
  INVITE_KIND_PARTY = 1;
  INVITE_KIND_CLAN = 2;
  INVITE_KIND_TRADE = 3;
}

// Alguém convidou você. Expira em expires_ms.
message Invite {
  uint32 id = 1;
  InviteKind kind = 2;
  string from_name = 3;
  string extra = 4; // clã: nome do clã
  uint32 expires_ms = 5;
}

message PartyMember {
  uint32 id = 1;
  string name = 2;
  string class = 3;
  uint32 level = 4;
  uint32 hp = 5;
  uint32 max_hp = 6;
  uint32 mp = 7;
  uint32 max_mp = 8;
  float x = 9;
  float z = 10;
  bool dead = 11;
  string map = 12; // em outro mapa: o nome dele ("" = no mesmo mapa que você; vida e posição não valem)
}

// Seu grupo (members vazio = sem grupo).
message PartyState {
  uint32 leader_id = 1;
  repeated PartyMember members = 2;
}

message ClanMember {
  uint32 character_id = 1;
  string name = 2;
  string class = 3;
  uint32 level = 4;
  ClanRank rank = 5;
  bool online = 6;
}

// Seu clã (id 0 = sem clã).
message ClanState {
  uint64 id = 1;
  string name = 2;
  string notice = 3;
  ClanRank my_rank = 4;
  repeated ClanMember members = 5;
  uint32 max_members = 6;
  uint32 join_wait_ms = 7; // sem clã: falta este tempo para poder entrar em outro
  uint32 create_level = 8; // requisitos para criar
  uint32 create_cost = 9;
}

enum ChannelKind {
  CHANNEL_KIND_NONE = 0; // terminou ou foi interrompida
  CHANNEL_KIND_TELEPORT = 1;
  CHANNEL_KIND_RETURN = 2; // pergaminho de retorno
}

// Barra de canalização (só para o dono).
message ChannelBar {
  ChannelKind kind = 1;
  uint32 total_ms = 2;
  string label = 3;
}

message EnchantResult {
  bool ok = 1;
  bool broke = 2; // falhou e o item quebrou
  uint32 level = 3; // nível final
  string item_name = 4;
}

// O armazém da conta (enviado ao abrir e a cada mudança).
message Storage {
  uint32 npc_id = 1;
  uint64 gold = 2;
  uint32 size = 3;
  repeated ItemStack items = 4; // place = 2
}

// Regras do encantamento (o cliente mostra a chance e o bônus).
message EnchantRules {
  uint32 safe = 1;
  uint32 max = 2;
  repeated float chance = 3; // chance[n] = de chegar a +n
  // Ataque por nível, por raridade (índice 1–4). Cada nível acima de `safe` vale o dobro;
  // armaduras somam metade disso (arredondado) em P.Def e M.Def, joias só em M.Def.
  repeated uint32 weapon_bonus = 4;
}

message TeleportDest {
  uint32 id = 1;
  string name = 2;
  float x = 3;
  float z = 4;
  uint32 price = 5;
}

enum NpcRole {
  NPC_ROLE_SHOP = 0;
  NPC_ROLE_TELEPORT = 1;
  NPC_ROLE_STORAGE = 2;
  NPC_ROLE_BARBER = 3;
  NPC_ROLE_MASTER = 4; // Mestra dos Caminhos (especialização)
  NPC_ROLE_GATE = 5; // portão para outro mapa (UseGate)
}

// Atributos e skills aprendidas do jogador.
message Progress {
  Attrs base = 1; // base da classe
  Attrs spent = 2; // pontos já distribuídos
  uint32 free_attr_points = 3;
  repeated SkillRank ranks = 4;
  uint32 free_skill_points = 5;
  // O que +1 ponto em cada atributo muda agora (ordem: for, des, con, int, sab, esp).
  // As fórmulas são lineares nos atributos: dá para prever qualquer distribuição somando.
  repeated StatBlock per_point = 6;
  string spec = 7; // especialização escolhida ("" = nenhuma); o bônus dela já está nos atributos
}

// Atributos de combate (valores finais ou diferenças).
message StatBlock {
  float max_hp = 1;
  float max_mp = 2;
  float p_atk = 3;
  float m_atk = 4;
  float p_def = 5;
  float m_def = 6;
  float crit = 7; // chance (0–1)
  float accuracy = 8;
  float evasion = 9;
  float atk_speed = 10; // ataques por segundo
  float cast_speed = 11; // multiplicador da recarga (1 = normal; 1,2 = recarrega 20% mais rápido)
  float hp_regen = 12; // por segundo, em combate
  float mp_regen = 13;
  float crit_damage = 14; // multiplicador do crítico (2 = dobro)
  float speed = 15;
}

message Hotbar {
  repeated string slots = 1;
}

// Ramo da árvore de skills da classe.
message SkillBranch {
  string name = 1;
  string description = 2;
  string color = 3; // "#rrggbb"
}

// Resposta ao Join: quem você é, quem já está na zona e suas skills.
message Welcome {
  uint32 your_id = 1;
  uint32 tick_rate = 2;
  float zone_size = 3;
  repeated Entity entities = 4;
  repeated SkillInfo skills = 5;
  float safe_radius = 6;
  repeated MapZone zones = 7; // zonas de caça (para o mapa)
  int64 server_time_ms = 8; // relógio do servidor (Unix, ms) para o ciclo dia/noite
  uint32 day_cycle_ms = 9; // duração do ciclo dia/noite
  repeated SkillInfo skill_catalog = 10; // todas as skills do jogo (visual das skills dos outros)
  repeated ItemInfo item_catalog = 11; // todos os itens do jogo
  Inventory inventory = 12;
  repeated GroundItem ground_items = 13; // itens no chão agora
  repeated NpcInfo npcs = 14; // lojas dos NPCs
  Progress progress = 15;
  Hotbar hotbar = 16;
  repeated SkillBranch branches = 17; // os 3 ramos da árvore da classe (skills.branch aponta aqui)
  SelfPvp pvp = 18;
  ClanState clan = 19;
  EnchantRules enchant = 20;
  repeated BossStatus bosses = 21; // chefes fixos (vivos ou com a janela de renascimento)
  repeated SpecInfo specs = 22; // as especializações de todas as classes
  string map = 23; // id do mapa desta zona ("" ou "starter" = o mapa de sempre, /world.json)
  string map_title = 24; // nome do mapa (minimapa e mapa do mundo)
}

// Zona de caça: um anel ao redor da cidade, ou um ponto fixo (chefe).
message MapZone {
  string name = 1; // nomes dos monstros
  float r_min = 2;
  float r_max = 3;
  uint32 level_min = 4;
  uint32 level_max = 5;
  bool fixed = 6; // ponto fixo em (x, z)
  float x = 7;
  float z = 8;
  bool boss = 9;
  bool area = 10; // área de caça própria (disco de centro x, z e raio radius)
  float radius = 11;
  string region = 12; // nome da região ("Vale das Pedras Vivas")
  bool raid = 13; // raid boss (covil próprio)
}

message Spawn {
  Entity entity = 1;
}

message Despawn {
  uint32 id = 1;
}

// Enviado a cada tick, apenas com o que mudou (delta).
message Snapshot {
  uint32 tick = 1;
  repeated EntityState states = 2;
  repeated HpUpdate hp = 3;
  repeated CombatEvent combat = 4;
  repeated EffectEvent effects = 5;
  repeated uint32 deaths = 6;
  repeated Revive revives = 7;
  repeated LevelUp level_ups = 8;
  repeated EffectEnd effect_ends = 9;
  repeated SkillCast casts = 10;
  repeated Telegraph telegraphs = 11;
}

message Pong {
  double client_time = 1;
}

enum ChatChannel {
  CHAT_CHANNEL_UNSPECIFIED = 0;
  CHAT_CHANNEL_GENERAL = 1;
  CHAT_CHANNEL_WHISPER = 2;
  CHAT_CHANNEL_SYSTEM = 3;
  CHAT_CHANNEL_PARTY = 4;
  CHAT_CHANNEL_CLAN = 5;
}

message ChatMessage {
  ChatChannel channel = 1;
  uint32 from_id = 2;
  string from_name = 3;
  string to_name = 4; // só em sussurros
  string text = 5;
}

// O servidor vai encerrar a conexão (ex.: o mesmo personagem entrou em outro lugar).
message Kicked {
  string reason = 1;
}

// Atributos do próprio personagem (só para o dono).
message SelfStats {
  uint32 hp = 1;
  uint32 max_hp = 2;
  uint32 mp = 3;
  uint32 max_mp = 4;
  uint32 level = 5;
  uint64 xp = 6;
  uint64 xp_level_start = 7;
  uint64 xp_next_level = 8; // XP total para o próximo nível (0 = nível máximo)
  uint32 p_atk = 9;
  uint32 m_atk = 10;
  uint32 p_def = 11;
  float speed = 12;
  bool dead = 13;
  uint32 m_def = 14;
  float crit = 15; // chance de crítico (0–1)
  // Detalhes de combate (valores finais, com atributos, equipamento, passivas e buffs).
  float accuracy = 16;
  float evasion = 17;
  float atk_speed = 18; // ataques por segundo
  float cast_speed = 19;
  float hp_regen = 20; // por segundo, em combate (fora de combate: 5×)
  float mp_regen = 21;
  float crit_damage = 22;
  string killed_by = 23; // morto: quem matou (jogador)
}

// Recarga de skill (só para o dono).
message SkillCooldown {
  uint32 skill_id = 1;
  uint32 ready_in_ms = 2;
}

// Bolsa e equipamento completos (só para o dono), enviados a cada mudança.
message Inventory {
  uint64 gold = 1;
  repeated ItemStack items = 2;
  uint32 bag_size = 3;
}

// Itens que apareceram no chão (drop de monstro).
message GroundItemsAdded {
  repeated GroundItem items = 1;
}

// Itens que saíram do chão (alguém pegou ou venceu o tempo).
message GroundItemsRemoved {
  repeated uint32 ids = 1;
  uint32 picked_by = 2; // 0 = sumiu sozinho
}

// Recarga de um grupo de consumíveis (só para o dono). 1 = vida, 2 = mana.
message ItemCooldown {
  uint32 group = 1;
  uint32 ready_in_ms = 2;
  uint32 total_ms = 3;
}

// A arma de alguém mudou (todos veem).
message Appearance {
  uint32 id = 1;
  string weapon = 2;
  string offhand = 3;
  uint32 weapon_grade = 4;
  uint32 weapon_enchant = 5;
  BodyLook look = 6;
}

// ---------- Tipos ----------

message ItemStack {
  uint32 place = 1; // 0 = bolsa, 1 = equipado
  uint32 slot = 2;
  string item_id = 3;
  uint32 count = 4;
  uint32 enchant = 5; // +N
}

message GroundItem {
  uint32 id = 1;
  string item_id = 2;
  uint32 count = 3;
  float x = 4;
  float z = 5;
  uint32 owner_id = 6; // reservado para este jogador…
  uint32 reserved_ms = 7; // …por mais este tempo (0 = livre)
  uint32 enchant = 8;
}

message NpcInfo {
  uint32 id = 1;
  repeated string stock = 2; // ids dos itens à venda
  NpcRole role = 3;
  repeated TeleportDest dests = 4; // pedras de teleporte: destinos
  repeated RecipeInfo recipes = 5; // Ferreiro: o que dá para criar
  string gate_to = 6; // portão: nome do mapa de destino
}

message RecipeInfo {
  string id = 1;
  string result_id = 2;
  uint32 count = 3;
  repeated RecipeMaterial materials = 4;
  int64 gold = 5;
}

message RecipeMaterial {
  string item_id = 1;
  uint32 count = 2;
}

enum ItemKind {
  ITEM_KIND_UNSPECIFIED = 0;
  ITEM_KIND_WEAPON = 1;
  ITEM_KIND_SHIELD = 2;
  ITEM_KIND_ARMOR = 3;
  ITEM_KIND_HELMET = 4;
  ITEM_KIND_POTION = 5;
  ITEM_KIND_MATERIAL = 6;
  ITEM_KIND_GOLD = 7;
  ITEM_KIND_LEGS = 8;
  ITEM_KIND_GLOVES = 9;
  ITEM_KIND_BOOTS = 10;
  ITEM_KIND_CAPE = 11;
  ITEM_KIND_NECKLACE = 12;
  ITEM_KIND_EARRING = 13;
  ITEM_KIND_RING = 14;
  ITEM_KIND_SCROLL = 15;
}

enum ScrollKind {
  SCROLL_KIND_NONE = 0;
  SCROLL_KIND_RETURN = 1;
  SCROLL_KIND_ENCHANT_WEAPON = 2;
  SCROLL_KIND_ENCHANT_ARMOR = 3;
}

message ItemBonus {
  int32 max_hp = 1;
  int32 max_mp = 2;
  int32 p_atk = 3;
  int32 m_atk = 4;
  int32 p_def = 5;
  int32 m_def = 6;
  float crit = 7;
  float accuracy = 8;
  float evasion = 9;
  float speed = 10; // m/s
  float atk_speed = 11; // 0,05 = +5% de ataques por segundo
  float cast_speed = 12; // 0,05 = +5% de velocidade de conjuração
  float hp_regen = 13; // por segundo
  float mp_regen = 14;
  float crit_damage = 15; // somado ao multiplicador do crítico
}

message ItemInfo {
  string id = 1;
  string name = 2;
  ItemKind kind = 3;
  uint32 grade = 4; // 1 comum, 2 bom, 3 raro, 4 épico
  int32 slot = 5; // encaixe de equipamento (-1 = não se equipa)
  repeated string classes = 6; // vazio = todas
  uint32 req_level = 7;
  ItemBonus bonus = 8;
  uint32 stack = 9;
  uint32 price = 10;
  uint32 sell_price = 11;
  string icon = 12;
  string description = 13;
  uint32 cooldown_group = 14;
  uint32 cooldown_ms = 15;
  uint32 heal_hp = 16;
  uint32 heal_mp = 17;
  string model = 18;
  string off_model = 19;
  // Encaixes onde o item pode ir (0 arma, 1 mão secundária, 2 peito, 3 cabeça, 4 pernas,
  // 5 mãos, 6 pés, 7 capa, 8 colar, 9–10 brincos, 11–12 anéis). `slot` é o primeiro.
  repeated uint32 slots = 20;
  string weapon_type = 21; // armas: sword, axe, staff, daggers
  ScrollKind scroll = 22;
  bool blessed = 23; // pergaminho abençoado: falhar não quebra (volta a +0)
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_MONSTER = 2;
  ENTITY_KIND_NPC = 3;
  ENTITY_KIND_OBJECT = 4; // objeto temporário no chão (ex.: estandarte)
}

message Entity {
  uint32 id = 1;
  string name = 2;
  float x = 3;
  float z = 4;
  float target_x = 5;
  float target_z = 6;
  float speed = 7;
  string model = 8; // classe do jogador ou tipo do monstro
  EntityKind kind = 9;
  uint32 level = 10;
  uint32 hp = 11;
  uint32 max_hp = 12;
  bool dead = 13;
  float scale = 14; // tamanho visual (0 = 1)
  bool boss = 15; // chefe
  string weapon = 16; // modelo da arma (jogadores)
  string offhand = 17; // modelo da outra mão
  uint32 weapon_grade = 18;
  string title = 19; // NPC: função (ex.: "Mercadora"); jogador: título escolhido (conquista)
  string emblem = 20; // jogadores: cor do emblema (#rrggbb), pinta o nome e o anel no chão
  PvpState pvp_state = 21;
  string clan_name = 22;
  uint32 weapon_enchant = 23;
  BodyLook look = 24; // jogadores: visual do corpo
  bool raid = 25; // raid boss (barra no topo da tela)
  string spec = 26; // jogadores: especialização (SpecInfo.id; "" = nenhuma)
}

message EntityState {
  uint32 id = 1;
  float x = 2;
  float z = 3;
  float target_x = 4;
  float target_z = 5;
  float speed = 6; // velocidade atual (buffs/lentidão)
  bool teleport = 7; // pulou para (x, z): o cliente não interpola (Piscar, Investida)
}

message HpUpdate {
  uint32 id = 1;
  uint32 hp = 2;
  uint32 max_hp = 3;
}

message CombatEvent {
  uint32 source_id = 1;
  uint32 target_id = 2;
  uint32 skill_id = 3; // 0 = ataque básico
  uint32 damage = 4;
  bool crit = 5;
  bool miss = 6;
  bool kill = 7;
  Effect dot = 8; // dano de veneno/queimadura/praga (sem animação de golpe)
  uint32 absorbed = 9; // quanto um escudo segurou
  uint32 heal = 10; // vida que quem bateu recuperou (roubo de vida)
}

enum Effect {
  EFFECT_UNSPECIFIED = 0;
  EFFECT_STUN = 1;
  EFFECT_SLOW = 2;
  EFFECT_BUFF_DEF = 3;
  EFFECT_BUFF_ATK = 4;
  EFFECT_BUFF_SPEED = 5;
  EFFECT_ROOT = 6; // não anda (ainda ataca)
  EFFECT_POISON = 7; // dano por segundo (value)
  EFFECT_BURN = 8; // dano por segundo (value)
  EFFECT_TAUNT = 9; // monstro obrigado a atacar quem provocou
  EFFECT_SHIELD = 10; // absorve dano (value = quanto ainda absorve)
  EFFECT_MANA_SHIELD = 11; // dano sai da mana (value = MP por ponto de dano)
  EFFECT_INVISIBLE = 12; // monstros não veem; atacar revela; próximo golpe é crítico
  EFFECT_MARK = 13; // recebe +value de dano (fração)
  EFFECT_UNDYING = 14; // a vida não cai abaixo de 1
  EFFECT_BLIND = 15; // erra mais (value = precisão perdida)
  EFFECT_BUFF_ATK_SPEED = 16; // +value de velocidade de ataque
  EFFECT_WEAKEN = 17; // -value de ataque
  EFFECT_FROST_ARMOR = 18; // +value de defesa; quem bate corpo a corpo fica lento
  EFFECT_PLAGUE = 19; // veneno que pula para os vizinhos quando o alvo morre (value = dano/s)
  EFFECT_WAR_CRY = 20; // +value de ataque (grito de guerra, soma com outros buffs)
  EFFECT_BANNER = 21; // +value de defesa (perto do estandarte)
  EFFECT_COURAGE = 22; // regenera value de vida por segundo (aura)
  EFFECT_DEATH_MARK = 23; // Marca da Morte do raid boss: explode em volta do marcado
}

message EffectEvent {
  uint32 target_id = 1;
  Effect effect = 2;
  uint32 duration_ms = 3;
  uint32 source_id = 4; // quem aplicou
  float value = 5; // intensidade (ex.: 0.5 = 50%)
}

// Um efeito acabou (venceu ou o alvo morreu).
message EffectEnd {
  uint32 target_id = 1;
  Effect effect = 2;
}

// Skill em si mesmo ou em área foi usada (para mostrar o efeito mesmo sem acertar ninguém).
message SkillCast {
  uint32 source_id = 1;
  uint32 skill_id = 2;
  uint32 target_id = 3; // skills de alvo sem dano direto (Frasco Tóxico, Praga): para o visual
}

message Revive {
  uint32 id = 1;
  float x = 2;
  float z = 3;
  uint32 hp = 4;
  uint32 max_hp = 5;
}

message LevelUp {
  uint32 id = 1;
  uint32 level = 2;
  uint32 max_hp = 3;
}

enum SkillTarget {
  SKILL_TARGET_UNSPECIFIED = 0;
  SKILL_TARGET_ENEMY = 1;
  SKILL_TARGET_SELF = 2;
  SKILL_TARGET_AREA = 3;
}

message SkillInfo {
  uint32 id = 1;
  string name = 2;
  uint32 key = 3;
  uint32 mp_cost = 4;
  uint32 cooldown_ms = 5;
  float range = 6;
  SkillTarget target = 7;
  string description = 8;
  string fx = 9; // id do visual e do ícone (ex.: "fireball")
  bool magic = 10; // dano mágico (MAtk/MDef)
  float power = 11; // multiplicador de dano (0 = sem dano)
  Effect effect = 12; // efeito aplicado (no alvo ou em si mesmo)
  uint32 effect_ms = 13;
  float effect_value = 14;
  bool effect_on_self = 15;
  float extra_crit = 16;
  // Árvore de skills
  uint32 branch = 17; // 0–2 (Welcome.branches); 3 = ramo da especialização
  uint32 tier = 18; // 0–3
  uint32 max_rank = 19;
  bool passive = 20;
  uint32 level_req = 21;
  uint32 parent_id = 22; // nó de cima no ramo (0 = raiz)
  repeated SkillRankInfo ranks = 23; // valores em cada rank (índice 0 = rank 1)
  float splash = 24; // raio em volta do alvo (0 = só o alvo)
  string spec = 25; // especialização dona da skill ("" = árvore da classe); branch = 3
}

// Valores de uma skill num rank.
message SkillRankInfo {
  uint32 mp_cost = 1;
  uint32 cooldown_ms = 2;
  float power = 3;
  uint32 effect_ms = 4;
  float effect_value = 5;
  string text = 6; // o que faz neste rank, para a dica
}

// ---------- Amigos, correio e emotes ----------

enum FriendCmdKind {
  FRIEND_CMD_UNSPECIFIED = 0;
  FRIEND_CMD_ADD = 1; // name (pode estar offline) ou target_id (botão do quadro do alvo)
  FRIEND_CMD_REMOVE = 2; // name ou target_id (id do personagem)
  FRIEND_CMD_LIST = 3; // pede a lista com as posições de agora (janela aberta)
}

message FriendCmd {
  FriendCmdKind kind = 1;
  string name = 2;
  uint32 target_id = 3;
}

enum MailCmdKind {
  MAIL_CMD_UNSPECIFIED = 0;
  MAIL_CMD_SEND = 1; // to + subject (opcional) + body
  MAIL_CMD_LIST = 2; // caixa de entrada
  MAIL_CMD_READ = 3; // mail_id: marcar como lida
  MAIL_CMD_DELETE = 4; // mail_id
}

message MailCmd {
  MailCmdKind kind = 1;
  string to = 2;
  string subject = 3;
  string body = 4;
  uint64 mail_id = 5;
}

// Um amigo (amizade de mão única: quem você segue). Online: posição atual (o cliente acha a região).
message Friend {
  uint32 character_id = 1;
  string name = 2;
  string class = 3;
  uint32 level = 4;
  bool online = 5;
  float x = 6;
  float z = 7;
}

message FriendList {
  repeated Friend friends = 1;
  uint32 max = 2;
}

message Mail {
  uint64 id = 1;
  string from_name = 2;
  string subject = 3;
  string body = 4;
  int64 sent_at_ms = 5;
  bool read = 6;
}

// Caixa de entrada. listed = false: só os contadores (aviso de carta nova ou ao entrar).
message MailBox {
  repeated Mail mails = 1;
  uint32 unread = 2;
  uint32 total = 3;
  uint32 max = 4;
  bool listed = 5;
  uint32 body_max = 6; // tamanho máximo do texto (caracteres)
  uint32 subject_max = 7;
}

// Amigos e/ou correio (só o que mudou vem preenchido).
message SocialUpdate {
  FriendList friends = 1;
  MailBox mail = 2;
}

enum EmoteKind {
  EMOTE_KIND_NONE = 0; // acabou (andou, atacou ou morreu)
  EMOTE_KIND_WAVE = 1; // acenar (uma vez)
  EMOTE_KIND_SIT = 2; // sentar (até se mexer)
  EMOTE_KIND_DANCE = 3; // dançar (até se mexer)
}

// Emote de um jogador, para quem está perto.
message Emote {
  uint32 id = 1;
  EmoteKind kind = 2;
}
