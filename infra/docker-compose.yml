name: erevia

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: erevia
      POSTGRES_PASSWORD: erevia
      POSTGRES_DB: erevia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erevia"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
